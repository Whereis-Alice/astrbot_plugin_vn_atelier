<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="视觉小说工房">
<title>视觉小说工房 · Visual Novel Atelier</title>
<desc>原创标识：星夜下的工房拱窗。窗棂分格 + 四芒星 + 窗台与菱形刻印。</desc>
<defs>
  <linearGradient id="plate" x1="0" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#1a2450"/>
    <stop offset="0.52" stop-color="#0e1431"/>
    <stop offset="1" stop-color="#07091a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7ee0ff"/>
    <stop offset="1" stop-color="#b79dff"/>
  </linearGradient>
  <linearGradient id="sky" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#3a58a6"/>
    <stop offset="0.55" stop-color="#2a3878"/>
    <stop offset="1" stop-color="#43356f"/>
  </linearGradient>
  <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="166" y1="100" x2="346" y2="340">
    <stop offset="0" stop-color="#b6efff"/>
    <stop offset="1" stop-color="#63bfe4"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7ee0ff" stop-opacity="0.30"/>
    <stop offset="0.6" stop-color="#7ee0ff" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#7ee0ff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="plateClip">
    <rect x="16" y="16" width="480" height="480" rx="104"/>
  </clipPath>
  <clipPath id="paneClip">
    <path d="M166,340 L166,190 A90,90 0 0 1 346,190 L346,340 Z"/>
  </clipPath>
</defs>

<g clip-path="url(#plateClip)">
  <rect x="16" y="16" width="480" height="480" fill="url(#plate)"/>
  <ellipse cx="256" cy="200" rx="216" ry="196" fill="url(#halo)"/>
  <circle cx="64" cy="92" r="3.4" fill="#dff3ff" opacity="0.62"/>
  <circle cx="104" cy="148" r="2.2" fill="#dff3ff" opacity="0.42"/>
  <circle cx="58" cy="210" r="2.6" fill="#dff3ff" opacity="0.5"/>
  <circle cx="92" cy="268" r="1.8" fill="#dff3ff" opacity="0.34"/>
  <circle cx="62" cy="330" r="3" fill="#dff3ff" opacity="0.55"/>
  <circle cx="110" cy="392" r="2.2" fill="#dff3ff" opacity="0.4"/>
  <circle cx="148" cy="448" r="2.6" fill="#dff3ff" opacity="0.46"/>
  <circle cx="214" cy="466" r="1.9" fill="#dff3ff" opacity="0.34"/>
  <circle cx="286" cy="470" r="3" fill="#dff3ff" opacity="0.5"/>
  <circle cx="360" cy="452" r="2.1" fill="#dff3ff" opacity="0.38"/>
  <circle cx="404" cy="396" r="2.7" fill="#dff3ff" opacity="0.48"/>
  <circle cx="452" cy="334" r="1.9" fill="#dff3ff" opacity="0.34"/>
  <circle cx="424" cy="268" r="3.2" fill="#dff3ff" opacity="0.58"/>
  <circle cx="456" cy="206" r="2.2" fill="#dff3ff" opacity="0.4"/>
  <circle cx="408" cy="148" r="2.6" fill="#dff3ff" opacity="0.46"/>
  <circle cx="352" cy="96" r="2" fill="#dff3ff" opacity="0.36"/>
  <circle cx="286" cy="66" r="2.8" fill="#dff3ff" opacity="0.5"/>
  <circle cx="176" cy="74" r="2.3" fill="#dff3ff" opacity="0.42"/>
</g>

<rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="5"/>
<rect x="46" y="46" width="420" height="420" rx="78" fill="none" stroke="#b79dff" stroke-opacity="0.16" stroke-width="3"/>

<g clip-path="url(#paneClip)">
  <path d="M166,340 L166,190 A90,90 0 0 1 346,190 L346,340 Z" fill="url(#sky)"/>
  <path d="M210.0,134.0 C215.4,160.6 215.4,160.6 242.0,166.0 C215.4,171.4 215.4,171.4 210.0,198.0 C204.6,171.4 204.6,171.4 178.0,166.0 C204.6,160.6 204.6,160.6 210.0,134.0 Z" fill="#f2fbff" opacity="0.96"/>
  <path d="M304.0,267.0 C307.1,281.9 307.1,281.9 322.0,285.0 C307.1,288.1 307.1,288.1 304.0,303.0 C300.9,288.1 300.9,288.1 286.0,285.0 C300.9,281.9 300.9,281.9 304.0,267.0 Z" fill="#d9ecff" opacity="0.82"/>
  <path d="M197.0,286.0 C198.9,295.1 198.9,295.1 208.0,297.0 C198.9,298.9 198.9,298.9 197.0,308.0 C195.1,298.9 195.1,298.9 186.0,297.0 C195.1,295.1 195.1,295.1 197.0,286.0 Z" fill="#d9ecff" opacity="0.6"/>
  <circle cx="301" cy="151" r="3.0" fill="#f2fbff" opacity="0.85"/>
  <circle cx="332" cy="205" r="2.1" fill="#f2fbff" opacity="0.55"/>
  <circle cx="230" cy="256" r="2.1" fill="#f2fbff" opacity="0.5"/>
</g>

<!-- 窗棂用 userSpaceOnUse 渐变：直线的包围盒有一边为 0，
     objectBoundingBox 渐变在这种情况下不会被绘制。 -->
<g fill="none" stroke="url(#frame)" stroke-linecap="round">
  <path d="M166,340 L166,190 A90,90 0 0 1 346,190 L346,340" stroke-width="13"/>
  <path d="M256,116 L256,338" stroke-width="10"/>
  <path d="M170,232 L342,232" stroke-width="10"/>
</g>

<rect x="146" y="352" width="220" height="12" rx="6" fill="#b79dff" opacity="0.92"/>
<rect x="182" y="372" width="148" height="5" rx="2.5" fill="#b79dff" opacity="0.42"/>
<path d="M256,382 L272,398 L256,414 L240,398 Z" fill="#7ee0ff"/>
</svg>
